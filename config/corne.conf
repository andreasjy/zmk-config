# Enable deep sleep when idle (saves battery on wireless)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Bluetooth - boost TX power for better range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Battery reporting over BLE
CONFIG_ZMK_BATTERY_REPORTING=y

# Combo settings - allow more simultaneous combos
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=6
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=4

# OLED display
CONFIG_ZMK_DISPLAY=y

# RGB underglow (uncomment if you want to use RGB)
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y
